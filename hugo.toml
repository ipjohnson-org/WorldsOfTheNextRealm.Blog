baseURL                = "https://ipjohnson-org.github.io/WorldsOfTheNextRealm.Blog/"
languageCode           = "en-us"
title                  = "Worlds of the Next Realm - Dev Blog"
theme                  = "hugo-theme-stack"
defaultContentLanguage = "en"
hasCJKLanguage         = false

[pagination]
    pagerSize = 10

[permalinks]
    post = "/p/:slug/"
    page = "/:slug/"

[taxonomies]
    category = "categories"
    tag = "tags"

[markup]
    [markup.goldmark]
        [markup.goldmark.renderer]
            unsafe = true

    [markup.tableOfContents]
        endLevel   = 4
        ordered    = true
        startLevel = 2

    [markup.highlight]
        noClasses          = false
        codeFences         = true
        guessSyntax        = true
        lineNoStart        = 1
        lineNos            = true
        lineNumbersInTable = true
        tabWidth           = 4

[related]
    includeNewer = true
    threshold    = 60
    toLower      = false
    [[related.indices]]
        name   = "tags"
        weight = 100
    [[related.indices]]
        name   = "categories"
        weight = 200

[menu]
    [[menu.social]]
        identifier = "github"
        name       = "GitHub"
        url        = "https://github.com/ipjohnson-org"
        [menu.social.params]
            icon = "brand-github"

[params]
    mainSections   = ["post"]
    rssFullContent = true

    [params.footer]
        since      = 2026
        customText = "Built by a human + AI team"

    [params.dateFormat]
        published   = "Jan 02, 2006"
        lastUpdated = "Jan 02, 2006"

    [params.sidebar]
        subtitle = "Building a game with AI — one commit at a time"
        compact  = false

    [params.article]
        headingAnchor = true
        math          = false
        toc           = true
        readingTime   = true

        [params.article.license]
            enabled = false

    [params.widgets]
        homepage = [
            { type = "search" },
            { type = "archives", params = { limit = 5 } },
            { type = "categories", params = { limit = 10 } },
            { type = "tag-cloud", params = { limit = 20 } },
        ]
        page = [{ type = "toc" }]

    [params.colorScheme]
        toggle  = true
        default = "dark"

    [params.imageProcessing]
        [params.imageProcessing.cover]
            enabled = true
        [params.imageProcessing.content]
            enabled = true

    [params.comments]
        enabled = true
        provider = "giscus"

        [params.comments.giscus]
            repo               = "ipjohnson-org/WorldsOfTheNextRealm.Blog"
            repoID             = "R_kgDORShc1g"
            category           = "General"
            categoryID         = "DIC_kwDORShc1s4C2pjC"
            mapping            = "pathname"
            lightTheme         = "light"
            darkTheme          = "dark_dimmed"
            reactionsEnabled   = 1
            emitMetadata       = 0
            inputPosition      = "top"
            lang               = "en"
            strict             = 0
            loading            = "lazy"
